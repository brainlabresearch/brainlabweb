# Regenerates publications.html from OpenAlex and commits it if anything changed.
# Runs monthly, and on demand from the Actions tab (Run workflow).
#
# If nothing changed, no commit is made and nothing redeploys.

name: Refresh publications

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch from OpenAlex
        run: node tools/fetch-publications.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- publications.html; then
            echo "No change to publications.html."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html
          git commit -m "Refresh publications from OpenAlex"
          git push
