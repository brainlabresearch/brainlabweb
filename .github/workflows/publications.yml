# Regenerates the two generated artefacts — publications.html and the topic-cloud
# data — and commits them if anything changed. Runs monthly, and on demand from
# the Actions tab (Run workflow).
#
# If nothing changed, no commit is made and nothing redeploys.

name: Refresh publications, topics, and news

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Exit 3 means Crossref was rate-limited badly enough that the citations
      # would have regressed, so the script left publications.html alone. That
      # must not abort the job: the news and topic refreshes below are unrelated
      # and still worth committing. The run is failed at the end instead, after
      # the commit, so the result is visible rather than buried in a green log.
      - name: Rebuild publications page
        id: publications
        run: |
          set +e
          node tools/fetch-publications.mjs
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo 'degraded=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Crossref rate-limited; publications.html left unchanged.'
            exit 0
          fi
          exit "$code"

      - name: Rebuild topic-cloud data
        run: node tools/fetch-topics.mjs

      - name: Rebuild news from RIT
        run: node tools/fetch-news.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- publications.html assets/data/topics.json news.html index.html feed.xml feed-announce.xml assets/news; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html assets/data/topics.json news.html index.html feed.xml feed-announce.xml assets/news
          git commit -m "Refresh publications, topics, and news"
          git push

      # Deliberately last. Everything above has already run and committed, so
      # this only reports — it does not cost the news refresh. Without it a
      # Crossref outage would leave publications.html quietly stale behind a
      # green tick, which is how the last one went unnoticed.
      - name: Report stale publications
        if: always() && steps.publications.outputs.degraded == 'true'
        run: |
          echo '::error::Crossref rate limiting left publications.html unrefreshed. Other updates were committed. Re-run the workflow to retry.'
          exit 1
