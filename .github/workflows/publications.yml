# Regenerates the two generated artefacts — publications.html and the topic-cloud
# data — and commits them if anything changed. Runs monthly, and on demand from
# the Actions tab (Run workflow).
#
# If nothing changed, no commit is made and nothing redeploys.

name: Refresh publications and topics

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild publications page
        run: node tools/fetch-publications.mjs

      - name: Rebuild topic-cloud data
        run: node tools/fetch-topics.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- publications.html assets/data/topics.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html assets/data/topics.json
          git commit -m "Refresh publications and topics from OpenAlex"
          git push
